# DEADRECKON :: Render Blueprint (free-tier only)
#
# Render has no free background worker, so deadreckon-ingest is NOT
# declared here. The ingest worker runs on a laptop and writes to this
# database over its external URL. See README "Running the worker locally".
#
# The architecture already separates the single writer from the readers,
# so moving the writer off-platform needs no code change at all.

databases:
  - name: deadreckon-db
    databaseName: deadreckon
    user: deadreckon
    plan: free # 1 GB, ONE per workspace, EXPIRES 30 DAYS AFTER CREATION
    postgresMajorVersion: "16"
    ipAllowList:
      # Required so the laptop-hosted ingest worker can connect. The API
      # reaches the database over Render's private network regardless.
      - source: 0.0.0.0/0
        description: laptop ingest worker

services:
  - type: web
    name: deadreckon-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build:server && npm run migrate
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: DATABASE_URL
        fromDatabase:
          name: deadreckon-db
          property: connectionString
      - key: FANOUT_TICK_MS
        value: "1000"
      - key: MAX_CELLS_PER_SOCKET
        value: "512"
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: deadreckon-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
