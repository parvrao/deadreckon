# DEADRECKON :: Render Blueprint (free-tier only)
#
# Render has no free background worker, so deadreckon-ingest is NOT
# declared here. The ingest worker runs on a laptop and writes to this
# database over its external URL. See README "Running the worker locally".
#
# The architecture already separates the single writer from the readers,
# so moving the writer off-platform needs no code change at all.

databases:
  - name: deadreckon-db
    databaseName: deadreckon
    user: deadreckon
    plan: free # 1 GB, ONE per workspace, EXPIRES 30 DAYS AFTER CREATION
    postgresMajorVersion: "16"
    ipAllowList:
      # Required so the laptop-hosted ingest worker can connect. The API
      # reaches the database over Render's private network regardless.
      - source: 0.0.0.0/0
        description: laptop ingest worker

services:
  - type: web
    name: deadreckon-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build:server && npm run migrate
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      # Set MANUALLY in the dashboard, not linked with fromDatabase.
      #
      # fromDatabase resolves to whichever Postgres user is currently
      # "default", and Render's docs say it re-resolves "on the next
      # Blueprint sync". In practice, after rotating the credential and
      # deleting the old user, the service kept building with the deleted
      # one and every deploy died on SQLSTATE 28000. Possibly a missed
      # sync, possibly the link not re-resolving. Either way an
      # indirection that silently serves a revoked credential is worse
      # than a value you can read on the page.
      #
      # Paste the INTERNAL Database URL here (Connections -> Internal).
      # Internal keeps the traffic on Render's private network: ~1ms
      # instead of ~40ms, and it never touches the IP allow list.
      #
      # After any future credential rotation, update this by hand.
      - key: DATABASE_URL
        sync: false
      - key: FANOUT_TICK_MS
        value: "1000"
      - key: MAX_CELLS_PER_SOCKET
        value: "512"
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: deadreckon-web
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
    routes:
      # SPA fallback, but NOT for hashed assets.
      #
      # A blanket /* -> /index.html rewrite turns every missing file into a
      # 200 with an HTML body. When a browser holds a cached index.html
      # pointing at a bundle hash that no longer exists, it requests that
      # .js, gets HTML, and refuses to execute it:
      #
      #   Failed to load module script: non-JavaScript MIME type "text/html"
      #
      # The app then never boots, and every subsequent fix appears to do
      # nothing because none of it is running. A missing asset must 404
      # honestly so the failure names itself.
      - type: rewrite
        source: /assets/*
        destination: /404-asset
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # index.html must never be cached. It is the one file that names the
      # current bundle hashes, so a stale copy points at files that are gone.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Hashed assets are immutable by construction: a new build produces a
      # new filename, so these can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
